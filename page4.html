<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- jQuery Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<body id="Gallery">
<div id="container">

<header>
    <img src="images/oakland 3.png" alt="Our community" width="1280" height="564" />

    <div class="main-header">
        <div class="logo">
            <img src="images/oaklans.jpg" alt="Meet Your Soulmate Logo" width="125" />
        </div>
    </div>

    <nav class="main-menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="page2.html">About</a></li>
            <li class="active"><a href="page4.html">Gallery</a></li>
            <li><a href="page3.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Check your beautiful Soul Mates waiting for you</h1>
    <p>Here are the photos of the soulmates waiting for you!</p>

    <ul id="album"></ul>

    <div id="infoBox">
        <h2 id="infoHeading"></h2>
        <p id="infoText"></p>
        <a href="#" id="closeBtn">Click This To Close</a>
    </div>
</main>

<footer>&copy; Copyright 2022 Westcliff Project</footer>
</div>


<div class="backdrop"></div>
<div class="box">
    <div class="close">x</div>
</div>


<script src="script.js"></script>


<script>
$(document).ready(function(){

    
    $(document).on('click', '.gallery-img', function(){

        $('.backdrop')
            .animate({'opacity':'.50'}, 300, 'linear')
            .css('display', 'block');

        $('.box').fadeIn();

        // Remove previous image
        $('.box img').remove();

        // Clone clicked image
        var img = $(this).clone();

        // Insert into lightbox
        $('.box').append(img);
    });

    /* Close lightbox */
    $('.close, .backdrop').click(function(){
        $('.backdrop').animate({'opacity':'0'}, 300, 'linear', function(){
            $('.backdrop').css('display', 'none');
        });
        $('.box').fadeOut();
    });

});
</script>

</body>
</html>
